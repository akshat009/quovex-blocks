name: Deploy to WordPress.org

on:
  push:
    tags:
      - "*"

jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      # WordPress.org is the only place the built plugin is published, so
      # nothing here generates a zip or attaches one to the GitHub release --
      # people install from the directory, and GitHub's own auto-generated
      # source archives are enough for anyone reading the code.
      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          # Without this the action looks for .wordpress-org/ (its default),
          # finds nothing, and silently ships the release with no banner,
          # icon or screenshots. Ours live in assets/.
          ASSETS_DIR: assets
