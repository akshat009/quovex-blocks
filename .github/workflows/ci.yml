name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  php:
    name: PHP ${{ matrix.php }} -- phpcs + phpunit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the plugin's declared minimum (composer.json's "require.php")
        # -- keeping it in the matrix catches accidental use of syntax/
        # functions only available on newer PHP before a real site running
        # the minimum supported version would.
        php: [ '7.4', '8.2' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: phpcs (WordPress Coding Standards)
        run: composer lint

      - name: phpunit
        run: composer test

  js:
    name: eslint + stylelint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: eslint
        run: npm run lint:js

      - name: stylelint
        run: npm run lint:css

      - name: JS Unit Tests
        run: npm run test:unit:js

      - name: Build
        run: npm run build
